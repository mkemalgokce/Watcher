pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.swift"
      exclude: "scripts/tests/fixtures/**"
      run: .tools/swiftformat --lint {staged_files}
    - name: lint
      glob: "*.swift"
      exclude: "scripts/tests/fixtures/**"
      run: .tools/swiftlint lint --strict --quiet --baseline .swiftlint-baseline.json {staged_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

commit-msg:
  jobs:
    - name: conventional commit
      run: scripts/check-commit-msg.sh {1}

# The code graph follows every change to the checked-out code.
post-commit: &graph
  jobs:
    - name: code graph
      run: scripts/update-graph.sh

post-merge: *graph

post-checkout: *graph
