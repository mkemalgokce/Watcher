name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the proxy on port 9090
        2. curl -x http://127.0.0.1:9090 https://example.com
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Watcher version
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, cookies and other secrets first.
      render: text
