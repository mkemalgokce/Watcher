name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install-tools.sh') }}
      - name: Install tools
        run: |
          brew install actionlint shellcheck
          make tools
      - name: Format and lint Swift
        run: make format-check lint
      # A full xcodebuild takes minutes, so unused-code analysis runs nightly and on demand, not on every change.
      - name: Analyze unused code
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make lint-analyze
      - name: Lint workflows and scripts
        run: |
          actionlint
          shellcheck scripts/*.sh scripts/tests/*.sh tools/*.sh tools/dmg/*.sh
      - name: Test scripts
        run: |
          bash scripts/tests/check-commit-msg-test.sh
          bash scripts/tests/coverage-gate-test.sh
          bash scripts/tests/lint-rules-test.sh

  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every run saves its build products, even when it fails, and the next one starts from the closest; only what
      # changed is compiled again.
      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-debug-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-debug-${{ runner.os }}-
      # make coverage skips WatcherInteractionTests: they need the Accessibility permission a runner lacks.
      - name: Test with coverage gate
        run: make coverage
      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage.lcov
            coverage/report.txt
          if-no-files-found: ignore

  # Builds the DMG unsigned after every merge, nightly and on demand: a release build takes minutes, so pull requests
  # skip it, and packaging problems still show up long before release day.
  package:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every run saves its build products, even when it fails, and the next one starts from the closest; only what
      # changed is compiled again.
      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-release-${{ runner.os }}-
      - name: Build the DMG
        run: |
          brew install create-dmg
          scripts/package-release.sh 0.0.0 1
      - name: Save the build cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
