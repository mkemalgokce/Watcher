name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Docs-only changes skip the macOS job; a skipped job satisfies a required check.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(Sources|Tests)/|^Package\.(swift|resolved)$|^\.swift(lint|format)|^Makefile$|^scripts/|^\.github/workflows/ci\.yml$'
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE "$pattern"; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: Lint workflows and scripts
        run: |
          ./actionlint -color
          shellcheck scripts/*.sh scripts/tests/*.sh tools/*.sh tools/dmg/*.sh
      - name: Test scripts
        run: |
          bash scripts/tests/check-commit-msg-test.sh
          bash scripts/tests/coverage-gate-test.sh
          bash scripts/tests/appcast-test.sh
          bash scripts/tests/package-release-test.sh
          bash scripts/tests/third-party-notices-test.sh

  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ hashFiles('scripts/install-tools.sh') }}
      - name: Install lint tools
        run: make tools
      - name: Format and lint
        run: |
          make format-check lint
          bash scripts/tests/lint-rules-test.sh
      # Each run saves its build, even a failing one, and the next resumes from the closest, compiling only what changed.
      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-debug-${{ hashFiles('Package.resolved') }}-
            spm-debug-
      - name: Test with coverage
        run: make coverage
      - name: Snapshot tests
        env:
          SNAPSHOT_TESTING_RECORD: never
        run: make test-snapshot
      - name: End-to-end tests
        timeout-minutes: 5
        run: make test-e2e
      - name: Save build cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            coverage.lcov
            coverage/report.txt
          if-no-files-found: ignore
          retention-days: 7
