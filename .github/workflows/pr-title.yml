name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    # Dependabot titles name Swift packages by URL and run past the limit; a skipped check still passes.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/check-commit-msg.sh
          sparse-checkout-cone-mode: false
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          COMMIT_SUBJECT_MAX: 66 # the squash commit gets " (#N)" appended
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          scripts/check-commit-msg.sh "$RUNNER_TEMP/title"
