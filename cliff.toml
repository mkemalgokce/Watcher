[changelog]
header = """
# Changelog

All notable changes to this project are documented here. This file is generated by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
postprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/mkemalgokce/watcher/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^refactor", group = "<!-- 4 -->Refactor" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^docs", group = "<!-- 6 -->Documentation" },
    { message = "^(build|ci)", group = "<!-- 7 -->Build & CI" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = "^(chore|style)", skip = true },
    { message = ".*", skip = true },
]
